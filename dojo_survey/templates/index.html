<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champion Survey</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Champion Survey</h1>

        <p class="intro">
            Tell us a little about yourself and your favorite programming language!
        </p>

        <form action="/results" method="POST">

            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="location">Dojo Location:</label>
                <input type="text" id="location" name="location" required>
            </div>

            <div class="form-group">
                <label for="language">Favorite Programming Language:</label>

                <select id="language" name="language" required>
                    <option value="">-- Choose a language --</option>
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="C#">C#</option>
                    <option value="C++">C++</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comment">Comment:</label>

                <textarea
                    id="comment"
                    name="comment"
                    rows="5"
                    placeholder="Tell us why you chose this language..."
                    required
                ></textarea>
            </div>

            <button type="submit">Submit Survey</button>

        </form>

    </div>

</body>
</html>
